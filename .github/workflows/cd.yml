name: CD

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate user interface from specifications
        run: |
          pip install -r scripts/python/pylib/requirements-user-interface.txt
          make -C scripts/python/pylib morphism-user-interface-constructor-install SILMARIL_PYTHON=python3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mathematical rendering assets
        run: |
          npm install --omit=dev --no-save --package-lock=false --prefix scripts/site
          node scripts/site/vendor.cjs
      - name: Build Jekyll
        working-directory: docs
        run: |
          bundle install
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --destination ../_site
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
