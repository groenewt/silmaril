name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  SILMARIL_PYTHON: python3

jobs:
  ui-constructor:
    name: UI Constructor Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate CSS from ontology
        run: |
          python3 scripts/ui-constructor.py \
            --input basicttl/ui_constructor.ttl \
            --output docs/assets/css/generated.css \
            --format css
      - name: Generate HTML from ontology
        run: |
          python3 scripts/ui-constructor.py \
            --input basicttl/ui_constructor.ttl \
            --output docs/_includes/build-status.html \
            --format html
      - name: Verify generated CSS matches committed
        run: |
          git diff --exit-code docs/assets/css/generated.css || {
            echo "UI CSS drift: docs/assets/css/generated.css does not match regeneration from basicttl/ui_constructor.ttl"
            exit 1
          }
      - name: Verify generated HTML matches committed
        run: |
          git diff --exit-code docs/_includes/build-status.html || {
            echo "UI HTML drift: docs/_includes/build-status.html does not match regeneration from basicttl/ui_constructor.ttl"
            exit 1
          }
      - name: UI constructor sync OK
        run: echo "UI assets in sync with ontology"

  site:
    name: Jekyll Site Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Build Jekyll site
        working-directory: docs
        run: |
          bundle install
          bundle exec jekyll build --destination _site

  ontology:
    name: Ontology Consolidation Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and compare committed artifacts
        run: make -C scripts/python/pylib morphism-ontology-consolidation-check

  semantics:
    name: Ontology Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install semantic dependencies
        run: pip install rdflib==7.6.0 pyshacl==0.40.1
      - name: Parse, conformance, and query gates
        run: make -C scripts/python/pylib morphism-ontology-validation
      - name: Ontology depth check (advisory)
        run: |
          python3 scripts/ontology-depth-check.py basicttl/ || true
          echo "Note: Depth check is advisory until legacy files are cleaned up"
        continue-on-error: true

  provenance:
    name: Signature Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the policy walks the full history
      - name: Trust manifest derives from the trust model
        run: make -C scripts/python/pylib morphism-provenance-trust-manifest-check
      - name: Commit signature policy (default)
        run: make -C scripts/python/pylib morphism-provenance-commit-policy-default

  scripts:
    name: Script Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # morphism tests observe real history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest==9.1.1 rdflib==7.6.0 pyshacl==0.40.1
      - name: Python syntax gate
        run: python3 -m compileall -q scripts
      - name: Shell syntax gate
        run: |
          find scripts -name "*.sh" -print0 | xargs -0 -n1 bash -n
          for h in hooks/pre-commit hooks/pre-push hooks/remote-update; do bash -n "$h"; done
      - name: Morphism process tests
        working-directory: scripts/python/pylib
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -m pytest -q tests/test_morphism_process_ledger.py $(ls tests/test_morphism_*_process.py tests/test_morphism_*_pipeline.py 2>/dev/null)
      - name: Pylib suite (advisory — pre-existing red migration census)
        working-directory: scripts/python/pylib
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -m pytest -q || printf '%s\n' 'advisory: pre-existing red-migration findings (documented in docs/unary-byte-frame-law.md)'
