name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  SILMARIL_PYTHON: python3

jobs:
  ontology-floors:
    name: Foundation and All Ontology Floors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install semantic dependencies
        run: pip install rdflib==7.6.0 pyshacl==0.40.1
      - name: Validate every standalone and merged ontology floor
        run: bash basicttl/foundation/checks/run-foundation-checks.sh

  algebra-spine:
    name: Folded Algebra Spine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install algebra validation dependencies
        run: pip install rdflib==7.6.0 pyshacl==0.40.1 PyYAML==6.0.3
      - name: Validate the folded algebra spine
        # Run independently so a foundation citation failure cannot hide algebra results.
        # Foundation still loads the folded declarations for merged-floor validation.
        # The runner requires fixture polarity, nonzero shape focus, manifest counts,
        # and ontology depth; its current receipts do not certify the native runtime.
        run: bash basicttl/primordial/type/algebra/checks/run-algebra-checks.sh

  browser-render:
    name: Root and Project Browser Rendering
    uses: ./.github/workflows/site-render.yml
    permissions:
      contents: read

  ui-constructor:
    name: User Interface Projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require admitted user interface runtime
        run: make -C scripts/python/pylib morphism-user-interface-runtime-admission
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install projection dependencies
        run: pip install -r scripts/python/pylib/requirements-user-interface.txt
      - name: Validate specifications and test projections
        run: make -C scripts/python/pylib morphism-user-interface-constructor-check

  site:
    name: Jekyll Site Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require admitted user interface runtime
        run: make -C scripts/python/pylib morphism-user-interface-runtime-admission
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate user interface from specifications
        run: |
          pip install -r scripts/python/pylib/requirements-user-interface.txt
          make -C scripts/python/pylib morphism-user-interface-constructor-install
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mathematical rendering assets
        run: |
          npm install --omit=dev --no-save --package-lock=false --prefix scripts/site
          node scripts/site/vendor.cjs
      - name: Build Jekyll site
        working-directory: docs
        run: |
          bundle install
          bundle exec jekyll build --destination _site

  ontology:
    name: Ontology Consolidation Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and compare committed artifacts
        run: make -C scripts/python/pylib morphism-ontology-consolidation-check

  semantics:
    name: Ontology Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install semantic dependencies
        run: pip install rdflib==7.6.0 pyshacl==0.40.1
      - name: Parse, conformance, and query gates
        run: make -C scripts/python/pylib morphism-ontology-validation
      - name: Ontology depth check (advisory)
        run: |
          python3 scripts/ontology-depth-check.py basicttl/ || true
          echo "Note: Depth check is advisory until legacy files are cleaned up"
        continue-on-error: true

  provenance:
    name: Signature Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the policy walks the full history
      - name: Trust manifest derives from the trust model
        run: make -C scripts/python/pylib morphism-provenance-trust-manifest-check
      - name: Commit signature policy (default)
        run: make -C scripts/python/pylib morphism-provenance-commit-policy-default

  scripts:
    name: Script Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # morphism tests observe real history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest==9.1.1 rdflib==7.6.0 pyshacl==0.40.1
      - name: Python syntax gate
        run: python3 -m compileall -q scripts
      - name: Shell syntax gate
        run: |
          find scripts -name "*.sh" -print0 | xargs -0 -n1 bash -n
          for h in hooks/pre-commit hooks/pre-push hooks/remote-update; do bash -n "$h"; done
      - name: Morphism process tests
        working-directory: scripts/python/pylib
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -m pytest -q tests/test_morphism_process_ledger.py $(ls tests/test_morphism_*_process.py tests/test_morphism_*_pipeline.py 2>/dev/null)
      - name: Required Python runtime and contract suite
        working-directory: scripts/python/pylib
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -m pytest -q
