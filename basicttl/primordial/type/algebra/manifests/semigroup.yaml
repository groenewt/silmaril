    VALUE: 'urn:silmaril:type:graph:instance:instruction:code:property'
  KIND:
    VALUE: 'per-rung coverage manifest'
  SCOPE:
    VALUE: 'semigroup'
GROUNDING:
  CARRIER:
    NOTATION:
      VALUE: 'the semigroup rung records in the on-disk merged algebra data graph, matched by the subdomain segment; lexical byte stream under locale C'
MATERIALIZATION:
  DISPOSITION:
    VALUE: 'every COUNT figure is recomputed from disk by run-algebra-checks.sh V6 (subdomain-segment match on semigroup); never a fixed constant'
  COUNT:
    THEORY:
      CARDINALITY:
        NOTATION:
          VALUE: '1'
    MODEL:
      CARDINALITY:
        NOTATION:
          VALUE: '1'
    DENOTATUM:
      CARDINALITY:
        NOTATION:
          VALUE: '1'
    DECLARATION:
      CARDINALITY:
        NOTATION:
          VALUE: '1'
    AXIOMS:
      CARDINALITY:
        NOTATION:
          VALUE: '2'
    THEOREMS:
      CARDINALITY:
        NOTATION:
          VALUE: '1'
    EQUATIONS:
      CARDINALITY:
        NOTATION:
          VALUE: '1'
    REDUCTS:
      CARDINALITY:
        NOTATION:
          VALUE: '1'
EVIDENCE:
  SOURCE:
    PACKAGE RELATIVE PATH:
      VALUE: 'basicttl/primordial/type/algebra/spine/semigroup.ttl'
    LINE:
      NOTATION:
        VALUE: 'the semigroup rung spine record; the V6 self-check recomputes these figures from the merged graph'
PROVENANCE:
  AUTHORITY:
    VALUE: 'W2 SP0 spine-fold, T-MANIFEST executor'
  STATE:
    VALUE: 'provisional'
GAPS:
