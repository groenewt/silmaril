# =====================================================================================
# semigroup.yaml — per-rung coverage manifest for the semigroup rung (W2 · SP0, T-MANIFEST).
# =====================================================================================
# Engine Flavor-B AOB envelope (refcomp/tar/bash/aob/urn/**/atom.spec.yaml). Every COUNT figure
# is DERIVED FROM DISK by run-algebra-checks.sh V6, which recomputes the semigroup rung's records by
# matching the subdomain segment ':subdomain:semigroup:kingdom:' over the merged algebra data graph and
# asserts disk == this manifest. Never hard-coded. PROBE: perturb any VALUE -> V6 RED; restore -> GREEN.
# Design §2 (record templates), §4 V6. Plan T-MANIFEST.
ATOM:
  IDENTITY:
    VALUE: 'urn:silmaril:type:graph:instance:instruction:code:property:domain:mathematics:realm:algebra:subdomain:semigroup:kingdom:manifest:phylum:coverage:class:rung:order:declarative:family:semigroup:genus:coverage:species:rung:component:manifest:instance:canonical'
